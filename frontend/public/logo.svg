<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="56" fill="url(#shine)"/>

  <!-- Ukraine flag – top left badge -->
  <g transform="translate(22, 28)">
    <rect width="26" height="18" rx="3" fill="#005BBB"/>
    <rect y="9" width="26" height="9" rx="0" fill="#FFD500"/>
    <rect width="26" height="18" rx="3" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- UK flag – top right badge -->
  <g transform="translate(72, 28)">
    <rect width="26" height="18" rx="3" fill="#012169"/>
    <!-- Diagonal white stripes -->
    <line x1="0" y1="0" x2="26" y2="18" stroke="#fff" stroke-width="3"/>
    <line x1="26" y1="0" x2="0" y2="18" stroke="#fff" stroke-width="3"/>
    <!-- Red diagonals -->
    <line x1="0" y1="0" x2="26" y2="18" stroke="#C8102E" stroke-width="1.5"/>
    <line x1="26" y1="0" x2="0" y2="18" stroke="#C8102E" stroke-width="1.5"/>
    <!-- White cross -->
    <line x1="13" y1="0" x2="13" y2="18" stroke="#fff" stroke-width="4.5"/>
    <line x1="0" y1="9" x2="26" y2="9" stroke="#fff" stroke-width="4.5"/>
    <!-- Red cross -->
    <line x1="13" y1="0" x2="13" y2="18" stroke="#C8102E" stroke-width="2.5"/>
    <line x1="0" y1="9" x2="26" y2="9" stroke="#C8102E" stroke-width="2.5"/>
    <rect width="26" height="18" rx="3" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- Arrows between flags (exchange / duel) -->
  <g stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <line x1="50" y1="34" x2="70" y2="34"/>
    <polyline points="66,30 70,34 66,38"/>
    <line x1="70" y1="40" x2="50" y2="40"/>
    <polyline points="54,36 50,40 54,44"/>
  </g>

  <!-- "D" letter – stylized -->
  <text x="60" y="82" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="36" fill="#fff" letter-spacing="-1">D</text>

  <!-- Underline accent -->
  <rect x="38" y="88" width="44" height="3.5" rx="1.75" fill="#FFD500" opacity="0.85"/>

  <!-- Subtle ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.15"/>
</svg>

