name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  # ---------------------------------------------------------------
  # Job 1 — Python unit tests (pytest, fast, no server needed)
  # ---------------------------------------------------------------
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint Python
        run: flake8 app server.py tests

      - name: Run unit tests
        run: pytest -v --tb=short

  # ---------------------------------------------------------------
  # Job 2 — HTTP integration tests (start server, hit real endpoints)
  # ---------------------------------------------------------------
  http-tests:
    name: HTTP Integration Tests
    runs-on: ubuntu-latest
    needs: python-tests            # only run after unit tests pass
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite:///./ci-test.db"
      ENABLE_LLM_SCORING: "false"
      SECRET_KEY: "ci-test-secret-key"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-3.11-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.11-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Start backend server
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/ > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "  Attempt $i/30..."
            sleep 1
          done
          # Final check — fail the step if server never came up
          curl -sf http://localhost:8000/api/ || (echo "Server failed to start" && exit 1)

      - name: Run HTTP integration tests
        run: python backend_test.py

      - name: Stop server
        if: always()
        run: kill $(lsof -t -i:8000) 2>/dev/null || true

  # ---------------------------------------------------------------
  # Job 3 — Dockerfile lint (runs in parallel with tests)
  # ---------------------------------------------------------------
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
