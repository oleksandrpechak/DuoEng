# render.yaml – Render Blueprint for DuoEng
# This tells Render how to build and deploy the frontend and backend.

services:
  # ── Frontend (Static Site) ──
  - type: web
    name: duoeng-frontend
    runtime: static
    buildCommand: cd frontend && yarn install --frozen-lockfile && yarn build
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Backend (Web Service) ──
  - type: web
    name: duoeng-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: ENV
        value: production
